version = 0.1

[default.deploy.parameters]
stack_name = "learn-dvorak-app"
resolve_s3 = true
s3_prefix = "learn-dvorak-app"
# CloudFront certificates must live in us-east-1 (docs/adr/0002)
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
# Domain is registered at GoDaddy and delegated to this Route 53 hosted zone
parameter_overrides = "DomainName=learndvorak.com HostedZoneId=Z057914128MXPILW6AYEP"
